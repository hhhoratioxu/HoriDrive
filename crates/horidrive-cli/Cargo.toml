[package]
name = "horidrive-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "horidrive"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
horidrive-core.workspace = true
horidrive-transport.workspace = true
horidrive-daemon.workspace = true
clap = { version = "4", features = ["derive"] }
tracing-subscriber.workspace = true

[dev-dependencies]
blake3.workspace = true
tempfile.workspace = true
horidrive-storage.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

