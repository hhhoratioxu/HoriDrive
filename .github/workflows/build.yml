name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: desktop
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
        working-directory: desktop
      - run: cargo build --locked --release -p horidrive-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: HoriDrive-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**
            target/${{ matrix.target }}/release/horidrive*
