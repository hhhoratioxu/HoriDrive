[workspace]
members = ["crates/*", "desktop/src-tauri"]
default-members = ["crates/horidrive-core", "crates/horidrive-storage", "crates/horidrive-transport", "crates/horidrive-daemon", "crates/horidrive-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
horidrive-storage = { path = "crates/horidrive-storage" }
horidrive-core = { path = "crates/horidrive-core" }
horidrive-transport = { path = "crates/horidrive-transport" }
horidrive-daemon = { path = "crates/horidrive-daemon" }

